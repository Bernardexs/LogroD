<ion-header>
  <ion-toolbar>
    <ion-title class="titulo">Tareas pendientes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item class="filtrar">
      <ion-select 
        slot="start" 
        aria-label="Filter" 
        [(ngModel)]="selectedCategory" 
        (ionChange)="filterTasks($event)" 
        interface="popover" 
        placeholder="Filtrar tareas">
        <ion-icon slot="end" name="funnel-outline"></ion-icon>
        <ion-select-option *ngFor="let categoria of categorias" [value]="categoria">{{ categoria }}</ion-select-option>
      </ion-select>
      <!-- Botón "Quitar filtro" solo visible si hay un filtro activo -->
      <ion-button *ngIf="selectedCategory" slot="end" (click)="clearFilter()">Quitar filtro</ion-button>
    </ion-item>
  </ion-list>

  <ion-searchbar 
    class="BuscarT"  
    (ionInput)="searchTasks($event.target.value || '')" 
    placeholder="Buscar tarea">
  </ion-searchbar>
  
  <ion-list>
    <ion-item *ngFor="let task of filteredTasks">
      <ion-checkbox 
        slot="start" 
        [checked]="task.completed" 
        (ionChange)="toggleTaskCompletion(task)">
      </ion-checkbox>
      <ion-label>
        <h2>{{ task.title }}</h2>
        <p>{{ task.description }}</p>
        <p>{{ task.startTime }}</p>
        <p>{{ task.endTime }}</p>
      </ion-label>
      <!-- Icono de Editar -->
      <ion-button 
        fill="clear" 
        color="primary" 
        slot="end" 
        (click)="addOrUpdateTask(task)">
        <ion-icon name="pencil-outline"></ion-icon>
      </ion-button>
      <!-- Icono de Eliminar -->
      <ion-button 
        fill="clear" 
        color="danger" 
        slot="end" 
        (click)="deleteTask(task)">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
    <ion-item *ngIf="filteredTasks.length === 0">
      <ion-label>No hay tareas para mostrar</ion-label>
    </ion-item>
  </ion-list>

  <ion-fab class="add" vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="addOrUpdateTask()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

<ion-footer class="vistas">
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tareas">
      <ion-icon name="checkmark-circle-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button routerLink="/home" tab="calendario">
      <ion-icon name="calendar-outline"></ion-icon>
    </ion-tab-button>

    <ion-tab-button tab="menu" id="popover-buttonn">
      <ion-icon  name="menu-outline"></ion-icon>
      <ion-popover trigger="popover-buttonn" [dismissOnSelect]="true">
        <ng-template>
          <ion-content>
            <ion-list>
              <ion-item button>
                <ion-icon name="notifications-outline" slot="start"></ion-icon>
                <ion-label>Notificaciones</ion-label>
              </ion-item>
              <ion-item button>
                <ion-icon name="bar-chart-outline" slot="start"></ion-icon>
                <ion-label>Productividad</ion-label>
              </ion-item>
              <ion-item button (click)="presentAlert()">
                <ion-icon name="log-out-outline" slot="start"></ion-icon>
                <ion-label>Cerrar Sesión</ion-label>
              </ion-item>

            </ion-list>
          </ion-content>
        </ng-template>
      </ion-popover>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
