<ion-header>
  <ion-toolbar>
    <ion-title class="titulo">Notificaciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let notification of notifications">
      <ion-thumbnail slot="start">
        <img *ngIf="notification.icon"  [src]="notification.icon" alt="Icono de Notificación"/> 
      </ion-thumbnail>
      <ion-label>
        <h2>{{ notification.title }}</h2>
        <p>{{ notification.body }}</p>
        <small>{{ notification.timestamp | date: 'short' }}</small>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>


<ion-footer class="vistas">
  <ion-tab-bar slot="bottom">
    <ion-tab-button routerLink="/tareas-p" tab="tareas">
      <ion-icon name="checkmark-circle-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button routerLink="/home" tab="calendario">
      <ion-icon name="calendar-outline"></ion-icon>
    </ion-tab-button>

    <ion-tab-button tab="menu" id="popover-buttonn">
      <ion-icon  name="menu-outline"></ion-icon>
      <ion-popover trigger="popover-buttonn" [dismissOnSelect]="true">
        <ng-template>
          <ion-content >
            <ion-list >
              <ion-item button>
                <ion-icon name="notifications-outline" slot="start"></ion-icon>
                <ion-label>Notificaciones</ion-label>
              </ion-item>
              <ion-item (click)="navegarPro()" button>
                <ion-icon name="bar-chart-outline" slot="start"></ion-icon>
                <ion-label>Productividad</ion-label>
              </ion-item>
              <ion-item button (click)="presentAlert()">
                <ion-icon name="log-out-outline" slot="start"></ion-icon>
                <ion-label>Cerrar Sesión</ion-label>
              </ion-item>

            </ion-list>
          </ion-content>
        </ng-template>
      </ion-popover>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
